name: mf

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: mf
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mf}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mf_local_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # read-only user for the REST API (docker/clickhouse/users.d/mf-api.xml)
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-mf_api_local_password}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      # Mount single files: the image entrypoint writes its own files into users.d.
      - ./docker/clickhouse/config.d/mf.xml:/etc/clickhouse-server/config.d/mf.xml:ro
      - ./docker/clickhouse/users.d/mf.xml:/etc/clickhouse-server/users.d/mf.xml:ro
      - ./docker/clickhouse/users.d/mf-api.xml:/etc/clickhouse-server/users.d/mf-api.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      # probe every 2s while starting (so dependants start promptly), then every 30s
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 5

  # The three images below build from source by default. To run published ones instead, set
  # MF_IMAGE_REGISTRY=ghcr.io/<owner>/ and MF_IMAGE_TAG=<commit SHA> (built by
  # .github/workflows/images.yml), then `docker compose pull && docker compose up -d --no-build`.
  mf:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: pipeline
    image: ${MF_IMAGE_REGISTRY:-}mf-pipeline:${MF_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      MF_CLICKHOUSE_URL: http://clickhouse:8123
      MF_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mf}
      MF_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mf_local_password}
      MF_CLICKHOUSE_DATABASE: mf
      MF_CONCURRENCY: ${MF_CONCURRENCY:-8}
      MF_SCHEDULE: ${MF_SCHEDULE:-0 0 */4 * * *}
      MF_TIMEZONE: ${MF_TIMEZONE:-Asia/Kolkata}
      MF_RUN_ON_START: ${MF_RUN_ON_START:-true}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # settings.toml / categories.csv are re-read on every run; edit without rebuilding
      - ./config:/app/config:ro
    # `run` = migrate, sync once at startup (the first run backfills everything), then ingest +
    # refresh on MF_SCHEDULE.
    command: ["run"]

  # Shared response cache for the API: pure LRU cache, no persistence, not published on the host.
  redis:
    image: redis:8.10
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: ${MF_IMAGE_REGISTRY:-}mf-api:${MF_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        # the API tolerates Redis being down (serves uncached), so it only needs to be started
        condition: service_started
    environment:
      MF_API_CLICKHOUSE_URL: http://clickhouse:8123
      MF_API_REDIS_URL: redis://redis:6379/0
      MF_API_CLICKHOUSE_USER: mf_api
      MF_API_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-mf_api_local_password}
      MF_API_CORS_ORIGINS: ${MF_API_CORS_ORIGINS:-*}
      MF_API_PUBLIC_URL: ${MF_API_PUBLIC_URL:-http://localhost:18080}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${MF_API_PORT:-18080}:8080"
    # Until the pipeline has created its tables the API exits and is restarted; /ready reports 503
    # until the first metrics are computed.

  # Next.js web UI. Talks to the API over the compose network; browsers only ever reach the UI,
  # which proxies client-side calls (search, calculators) through /api/v1.
  web:
    build:
      context: web
      args:
        SITE_URL: ${SITE_URL:-http://localhost:13000}
    image: ${MF_IMAGE_REGISTRY:-}mf-web:${MF_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      # started, not healthy: on a fresh install the API keeps restarting until the first
      # backfill has created its tables, and the UI must come up anyway (it shows an error
      # state until the API answers)
      api:
        condition: service_started
    environment:
      MF_API_URL: http://api:8080
      SITE_URL: ${SITE_URL:-http://localhost:13000}
    # not published: browsers reach it through `edge`

  # Public entry point: nginx in front of the UI with per-client rate limits
  # (docker/edge/default.conf.template). Over the limits a client gets 429 with Retry-After.
  edge:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      # Behind a tunnel or proxy, take the client address from this header, but only on requests
      # from MF_TRUSTED_PROXY (an address or CIDR). The default trusts nobody.
      MF_TRUSTED_PROXY: ${MF_TRUSTED_PROXY:-127.0.0.1}
      MF_REAL_IP_HEADER: ${MF_REAL_IP_HEADER:-X-Forwarded-For}
      NGINX_ENVSUBST_FILTER: "^MF_"
    volumes:
      - ./docker/edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      # MF_WEB_BIND=0.0.0.0 when a reverse proxy or tunnel on another host fronts the UI
      - "${MF_WEB_BIND:-127.0.0.1}:${MF_WEB_PORT:-13000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/edge-health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  clickhouse-data:
  clickhouse-logs:
