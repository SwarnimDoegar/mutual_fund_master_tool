# Builds the three runtime images and publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/mf-pipeline, mf-api (docker/Dockerfile targets) and mf-web (web/Dockerfile)
# tagged with the full commit SHA and the branch name. Deployments pull the SHA tag that matches
# the compose file and configs they check out (MF_IMAGE_REGISTRY / MF_IMAGE_TAG).
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (registry names must be lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # Both targets share one build stage: the second build reuses it from the builder's cache.
      - id: meta-pipeline
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PREFIX }}/mf-pipeline
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: pipeline
          push: true
          tags: ${{ steps.meta-pipeline.outputs.tags }}
          labels: ${{ steps.meta-pipeline.outputs.labels }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PREFIX }}/mf-api
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=rust

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (registry names must be lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PREFIX }}/mf-web
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          # The public origin is baked into prerendered metadata and robots.txt. Override with the
          # repository variable SITE_URL.
          build-args: SITE_URL=${{ vars.SITE_URL || 'https://mf.minraws.click' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
