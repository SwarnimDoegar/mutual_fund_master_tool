[package]
name = "mf"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["api"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
clickhouse = { version = "0.15.2", features = ["chrono", "uuid"] }
cron = "0.17.0"
csv = "1.4.0"
futures = "0.3.34"
include_dir = "0.7.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
