# The nginx image's own nginx.conf with room for more connections. The image allows 1,024 per
# worker, and every proxied request holds two (client and upstream), so around a thousand
# concurrent visitors exhausted them and nginx answered 500 or reset connections.
# The site itself is in default.conf.template.

user  nginx;
worker_processes  auto;
# Open files per worker: connections plus the files nginx keeps open (logs, temp files).
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  16384;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
